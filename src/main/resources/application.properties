spring.application.name=sdd

# ── Datasource ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5444/sdd
spring.datasource.username=postgres
spring.datasource.password=Ar14N@2023
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
# show-sql=false: Hibernate no logea SQL; controlado por logback-spring.xml
spring.jpa.show-sql=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── Error handling ────────────────────────────────────────────────────────────
# Stack trace NUNCA se expone al cliente; GlobalExceptionHandler lo registra en servidor
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ── Logging ───────────────────────────────────────────────────────────────────
# logback-spring.xml maneja appenders y rotacion
# Estos valores permiten cambiar verbosidad sin tocar codigo
logging.level.root=INFO
logging.level.com.sdd.sdd=INFO
# Para diagnostico en desarrollo, descomentar:
# logging.level.com.sdd.sdd=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE